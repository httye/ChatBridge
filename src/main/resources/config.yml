# ChatBridge 配置文件
# 多服务器聊天互通插件配置

# Redis 配置已内置 (localhost:6379, 无密码, database: 0)

# 安全配置
security:
  # 服务器密钥 - 每个服务器唯一，用于验证消息来源
  server-key: "your-secret-key-here"
  
  # 密钥列表URL和刷新间隔已内置

# 服务器配置
server:
  name: "Server1"         # 服务器唯一标识
  display-name: "&a&l生存服"  # 服务器显示名称（支持颜色代码）
  prefix:
    enabled: true         # 是否在玩家名字前显示服务器前缀
    format: "&7[&b{server}&7]"  # 服务器前缀格式，{server}为显示名称
    position: "before_name"     # 前缀位置: before_name(玩家名前) 或 before_message(消息前)

# 聊天配置
chat:
  # 是否启用全局聊天同步
  enabled: true
  
  # 是否同步服务器启动/关闭消息
  sync-server-status: true

# 敏感词过滤已内置并启用，违禁词替换字符固定为 ***

# 调试模式
debug: false
